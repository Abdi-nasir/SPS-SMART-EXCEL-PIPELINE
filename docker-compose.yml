

services:
  sps-dashboard:
    build: .
    container_name: sps-excel-dashboard
    ports:
      - "8501:8501"
    volumes:
      # Persist  files and processed data
       - ./data:/app/data
       - ./reports:/app/reports
       - ./logs:/app/logs
    environment:
      - TZ=UTC
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    networks:
      - sps-network


networks:
  sps-network:
    driver: bridge

