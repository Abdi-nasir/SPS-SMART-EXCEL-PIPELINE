# ============================================
# BASE PATHS
# ============================================
base_dir: .
data_dir: data
raw_dir: data/raw
processed_dir: data/processed
reports_dir: reports
logs_dir: logs

# ============================================
# FILE SETTINGS
# ============================================
allowed_extensions:
  - .xlsx
  - .xls
max_upload_size_mb: 200

# Sheet name patterns for detection
high_level_metrics_patterns:
  - high_level_metrics
  - high level metrics
  - high-level metrics
  - kpi
  - dashboard
  - summary
  - overview

# ============================================
# DASHBOARD SETTINGS
# ============================================
page_title: "SPS Board Dashboard"
page_layout: wide
sidebar_state: expanded

# Chart settings
chart_height: 600
chart_width: 1000
chart_template: plotly_white

# PDF Report settings
pdf_orientation: L
pdf_unit: mm
pdf_format: A4
pdf_margin: 10

# Header colors (RGB values)
header_color: [102, 126, 234]
kpi_sheet_header_color: [155, 89, 182]
data_sheet_header_color: [52, 152, 219]

# Footer text
footer_text: "Generated by SPS Excel Pipeline | Confidential"

# KPI color mapping
kpi_colors:
  volume: [52, 152, 219]
  value: [46, 204, 113]
  failed: [231, 76, 60]
  rate: [155, 89, 182]
  default: [52, 152, 219]

# ============================================
# COLUMN DETECTION KEYWORDS
# ============================================
value_column_keywords:
  - value
  - amount
  - total
  - price
  - payment_value
  - revenue
  - fee
  - cost
  - sum
  - sales
  - transaction_value

volume_column_keywords:
  - volume
  - count
  - qty
  - quantity
  - payment_volume
  - number
  - total_count
  - transaction_count

status_column_keywords:
  - status
  - state
  - result
  - outcome
  - transaction_status
  - type

date_column_keywords:
  - date
  - time
  - created
  - updated
  - timestamp
  - transaction_date
  - entry_date

category_column_keywords:
  - category
  - type
  - group
  - class
  - region
  - department
  - product

# ============================================
# SUCCESS/FAILURE DETECTION KEYWORDS
# ============================================
success_keywords:
  - success
  - succeeded
  - completed
  - approved
  - done
  - pass
  - active
  - "1"
  - "true"
  - yes

failure_keywords:
  - failed
  - fail
  - error
  - declined
  - rejected
  - cancelled
  - void
  - "0"
  - "false"
  - no

pending_keywords:
  - pending
  - waiting
  - processing
  - initiated
  - started


# ============================================
# ERROR NAMES
# ============================================
error_names:
  "LTXD": "Limit exceeded"
  "RFSP": "Request type is forbidden for sending participant"
  "ISRE": "Invalid signature on the receiving end"
  "ERRR": "TechnicalError"
  "RFRP": "Request type is forbidden for receiving participant"
  "MISS": "IPS did not receive a response from the payee’s participant"
  "INVA": ""
  "SystemError": "SystemError"
  "WBIC": "Participant’s BIC was not found in IPS"
  "NOVF": "IPS failed to send a request to the payee’s participant"
  "500": "Internal Server Error"
  "ValidationFailed": "Validation Failed"
  "InternalSystemError": "Internal System Error"
  "ERROR": " ERROR"
  "INV": "payment transaction amount or currency is invalid"
